- screen: etudiant
  note: "La seule action primaire de l'écran est celle de l'activité la plus urgente. Les autres lignes gardent un bouton secondaire, qui dit ce qu'il fait (Reprendre, Commencer)."
- screen: etudiant
  note: "L'échéance change de couleur à moins de 24 h (attention) et quand elle est dépassée (correction, avec le mot « En retard »). La couleur n'est jamais seule, l'icône et le texte la portent aussi."
- screen: etudiant
  note: "Les huit statistiques de l'accueil actuel passent sur une page Progression. Ici, trois chiffres seulement, alignés en chiffres tabulaires."
- screen: etudiant
  note: "Le chargement ne met en squelette que les données attendues. Le prénom, la date et les titres de section sont connus côté client et s'affichent tout de suite."
- screen: etudiant
  note: "L'état vide ne montre aucun zéro. Il explique comment un cours apparaît et renvoie vers l'aide."
- screen: notifications
  note: "Une notification non lue se distingue par un filet d'encre à gauche et un titre en gras, pas par une pastille. Cliquer une notification mène à l'objet concerné et la marque comme lue."
- screen: profil
  note: "Le thème quitte la barre supérieure pour le menu du profil, en trois choix explicites. Pour un administrateur, ce menu porte la mention Administrateur, qui remplace le cadre rouge actuel."
- screen: navigation
  note: "Sur mobile, la barre latérale devient un panneau. Les cibles passent à 44 px de haut. Le voile et Échap ferment le panneau."
- screen: etudiant
  note: "La couverture (barre latérale) est toujours sombre, dans le prune du logo. L'élément actif est un intercalaire, il prend la couleur de la page et la rejoint. On sait où l'on est sans lire."
- screen: etudiant
  note: "Chaque cours a une teinte, la même partout, sur l'icône de ses activités et sur l'onglet de son nom. Un cours achevé passe en chaleur (le dégradé du logo), le seul moment où ce dégradé sort du logo."
- screen: etudiant
  note: "Passe UX : Corrections disparaît de la navigation élève. La page ne liste que les corrections assignées : pour une élève qui ne corrige pas, c'était une page vide. Elle revient pour qui corrige."
- screen: etudiant
  note: "Le bloc chiffré vient de DashboardService.ofUser : moyenne, réussite, temps passé, sur tous les cours. « Tous mes résultats » est retiré : cette page n'existe pas."
- screen: etudiant
  note: "Pied de couverture : « Logiciel libre, par cisstech » vers le dépôt, comme le « Propulsé par » actuel, mais en texte discret, sous le profil. Présent pour tous les rôles."
