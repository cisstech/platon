- screen: intro
  note: "La page de garde de la copie, comme celle du candidat : une feuille avec la marge rouge, le nom et le groupe dans le coin comme sur une copie d'examen, et 5 consignes numérotées dans la marge, une par ligne réglée, en corps de lecture (16) sur bureau. Elles disent la règle telle qu'elle est : 1 h 30 dès le premier clic, un temps qui court quoi qu'il arrive, une copie rendue telle quelle à la fin, ce qui arrête l'épreuve et le code de reprise. À côté, en tête de sa zone, la seule action principale sous un titre qui dit que le chronomètre part au clic ; le retour au cours est permis, rien n'a commencé. Sur téléphone, la feuille prend toute la largeur, marge à 42 px, et Commencer est en bas, sous le pouce."
- screen: intro
  note: "Lundi 12 octobre, 8 h : l'examen ferme à 9 h 30 et dure 1 h 30, d'où « Ferme aujourd'hui à 9 h 30, commencez maintenant ». La marque AP1, en lagon, est en tête de toutes les pages du lecteur, comme sur les pages du cours. La feuille est posée sur la page : un filet, pas d'ombre."
- screen: intro
  note: "Rien ne se tape pour commencer : le code de l'activité ne lance pas l'épreuve, il rouvre une copie arrêtée (états interrompu et code-faux de l'exercice). La consigne 4 dit ce qui arrête l'épreuve. Dans la plateforme, l'arrêt vient des réglages de sécurité terminateOnLoseFocus (la fenêtre perd le focus) et terminateOnLeavePage (la page devient cachée, ou se rouvre), dans player-activity.component.ts. Le plein écran obligatoire est un réglage des maquettes (flow activité) : le lecteur d'aujourd'hui ne demande ni ne surveille le plein écran (aucun requestFullscreen). C'est un changement de modèle."
- screen: intro
  note: "iPhone (état ios) : Safari n'accorde pas le plein écran à une page (document.fullscreenEnabled vaut false) : la page le sait dès l'arrivée, sans clic. Le message est en attention, avec warning et le mot « impossible », dit ce que cela change (quitter la page ou changer d'application arrête toujours l'épreuve) et quoi faire (montrer l'écran à l'enseignant présent dans la salle). Commencer n'est pas bloqué, et ce message le décrit (aria-describedby). Question ouverte, la même que pour le candidat (tests, candidat, état plein-ecran du téléphone) : épreuve permise sans plein écran sur ces téléphones, ou ordinateur exigé. Les maquettes dessinent la première réponse, et l'enseignant de la salle peut proposer un ordinateur."
- screen: exercice
  note: "La copie et sa marge. Le numéro de la question et son résultat vivent dans la marge, comme les annotations d'un correcteur : « 3.1 » et « 3.2 » dans l'exercice 3 d'Inès, qui a deux questions, « 3 » dans l'exercice 3 de Mariam, qui n'en a qu'une ; la même règle sur bureau, téléphone, entraînement et candidat. La marge étant décorative, un lecteur d'écran entend le numéro en tête de la question (« Question 3.1 : »). L'énoncé est en corps de lecture, 72 caractères par ligne, identique sur téléphone. Trois pas de titre : le nom de l'épreuve, seul titre de niveau 1, en title (22) ; les questions en heading (17) ; le titre d'une confirmation en subheading (15)."
- screen: exercice
  note: "Le code d'un énoncé ou d'une réponse a ses lignes numérotées (.code.wrap, une ligne par .ln, son retrait en .i1, .i2, .i3). À 380 px, une ligne trop longue, comme return sum(ord(c) for c in mot) % 7, se replie sous son propre début, un cran plus loin et sans numéro : l'indentation reste lisible, rien ne défile de côté. Dans le produit, c'est le repli de l'éditeur (lineWrapping avec retrait) ; le texte copié garde ses espaces."
- screen: exercice
  note: "Valider est la seule action primaire. Sous les boutons, une ligne dit ce que chaque action fait de la réponse : Valider est définitif (le rappel, avec le cadenas, est relié au bouton par aria-describedby), Sauvegarder garde un brouillon, Exercice suivant garde aussi ce qui est tapé en brouillon sans le valider. Les autres actions n'apparaissent que si l'activité les autorise (aide, solution, recharger, sauvegarder)."
- screen: exercice
  note: "« Rendre ma copie » est en permanence dans l'en-tête, en secondaire, à côté de Notée. Sur le dernier exercice une fois validé (états bientot et rendre), il devient l'action primaire, une seule fois à l'écran : dans l'en-tête sur bureau, la copie offrant alors « Revenir à l'exercice 4 », le premier non validé ; en bas, sous le pouce, sur téléphone, la barre du haut ne gardant que le chronomètre. Une épreuve notée commencée n'a ni flèche de retour ni croix : seul Rendre la termine."
- screen: exercice
  note: "Épreuve notée (état valide) : Valider scelle sans révéler. La marge, la liste et le message portent le cadenas (lock, graphite) et le mot « enregistrée » ; la réponse scellée se lit en lecture seule (.input.sealed, .options.sealed : fond grisé, le choix fait reste marqué, les autres s'effacent). Le compteur avance (3 sur 8 enregistrés) et sa barre prend le lagon d'AP1, l'exercice suivant est l'action primaire. Ni juste ni faux, ni bonne réponse, ni explication : une tentative par exercice, le résultat attend la conclusion. Sur téléphone, la ligne de la barre du bas passe de « Valider est définitif » à « Réponses scellées à 8 h 17 », annoncée par une région polie."
- screen: exercice
  note: "Entraînement (état entrainement) : le quiz de la semaine 4, le 28 septembre, avec le réglage Déroulement « Résultat après chaque validation ». Le quiz a ses propres exercices, aucun en commun avec l'Examen partiel 2 : Inès en a fait 5 sur 6 (1, 2, 4 et 5 réussis, 3 réussi en partie, 6 pas commencé) et revient sur le 3, Boucles imbriquées, pour une deuxième tentative ; ses deux questions sont 3.1 et 3.2 dans la marge. Le retour immédiat (votre réponse, la bonne réponse, l'explication) n'existe que grâce au réglage. Vert et check_circle pour juste, rouge correcteur et error pour faux, ocre et contrast pour partiel, avec la note de l'exercice sur 100. Un entraînement garde sa flèche de retour : on le quitte et on y revient librement."
- screen: exercice
  note: "Entraînement sur téléphone : la même copie, marge à 42 px, retour sous chaque question. Le résultat de l'exercice (Réussi en partie, 50 / 100) et la tentative sont dans la barre du bas, au-dessus de Réessayer et Exercice suivant : c'est ce qu'Inès voit au moment où elle valide, sous le pouce."
- screen: exercice
  note: "La liste des exercices est une suite de boutons : chacun annonce son état aux lecteurs d'écran (enregistré, à faire, brouillon pas encore validé), l'exercice courant porte aria-current. Un brouillon a son glyphe, save en graphite, et le mot « brouillon » au bout de la ligne. Les icônes sont décoratives, le mot porte le sens."
- screen: exercice
  note: "Panne de PLaTon (état error, 8 h 20) : Inès a validé l'exercice 3 à 8 h 17 et ouvre le 4, que le service des exercices ne charge plus depuis 8 h 18. La page nomme le problème et depuis quand (cloud_off en correction, « impossible de charger »), rassure (exercices 1, 2 et 3 enregistrés), dit calmement que le temps continue de s'écouler et quoi faire : le signaler à l'enseignant présent dans la salle, puis réessayer. Le chronomètre garde sa vraie valeur, 1:09:40 : la plateforme compte depuis startedAt + duration (isTimeouted, getClosingTime, libs/feature/player/common/src/lib/player.model.ts). « Rendre ma copie » est inactif, relié à sa raison par aria-describedby : PLaTon ne peut pas recevoir la copie. Réessayer est primaire, en bas sur téléphone. Pas de Revenir au cours : l'épreuve n'a pas de sortie."
- screen: exercice
  note: "Plus que 10 minutes (état bientot, 9 h 20, si Inès n'avait pas rendu sa copie à 9 h 04) : le temps restant passe en attention avec le mot et ce qui arrive à 9 h 30. À la dernière minute, il passe en correction (.countdown.last, .m-timer.last et .m-time-note.last sur téléphone) avec « Moins d'une minute ». Une région aria-live polite, présente dès le début, n'annonce que ces seuils ; le chronomètre lui-même (role timer) n'est pas lu à chaque seconde. Les réponses scellées des questions 8.1 et 8.2 sont en lecture seule."
- screen: exercice
  note: "Candidat (état candidat, Mariam, vendredi 9 octobre à 15 h 05) : l'en-tête porte le nom du test, sans marque de cours, sans Notée et sans flèche de retour : un test commencé n'a pas de sortie, et Mariam n'a pas de cours où revenir. « Rendre mon test » ouvre la même confirmation (rendre, état candidat), qui mène à envoye. Le test compte 6 exercices ; Mariam a commencé à 14 h 30 et en a validé 2, il lui reste 55 minutes. L'exercice 3 n'a qu'une question : la marge dit « 3 »."
- screen: exercice
  note: "Connexion perdue (état reconnexion, 15 h 14) : la connexion de Mariam est coupée de 15 h 12 à 15 h 16. Un message neutre (wifi_off), car c'est une attente, dit depuis quand, que le temps continue de s'écouler (0:46:00, la vraie valeur) et ce qui est gardé. Sa réponse reste à l'écran en lecture seule : champ en pointillés (.input.offline, distinct du scellé) et la raison dessous, reliée par aria-describedby ; elle redevient modifiable avec la connexion, comme Valider, Sauvegarder, le changement d'exercice et « Rendre mon test ». Le bouton occupé garde son libellé. Au retour, une notification « Connexion rétablie » disparaît seule. Même dans la proposition de pause, une coupure de son côté ne mettrait pas le chronomètre en pause : le serveur ne la distingue pas d'une sortie."
- screen: exercice
  note: "Sur téléphone, la barre du haut d'une épreuve porte le chronomètre et « Rendre ma copie », sans croix. Le titre de niveau 1 est le nom de l'épreuve, en title, au-dessus des questions en heading. En bas, la ligne « Valider est définitif » juste au-dessus de Sauvegarder et Valider, puis la barre Précédent, Exercice 3 sur 8, Suivant ; le bouton du milieu ouvre la liste dans une feuille (état liste), qui se ferme par sa croix, le voile ou Échap. Cibles de 44 px au moins."
- screen: exercice
  note: "Épreuve arrêtée (état interrompu, lundi 12 octobre à 8 h 52) : Inès a quitté le plein écran. La copie laisse place à un message calme, pas une erreur : do_not_disturb_on en attention avec le mot « arrêtée » (ni error ni cloud_off, rien n'est cassé). Il dit pourquoi et à quelle heure, ce qui est gardé (cadenas pour les réponses validées 1, 2, 3 et 5, disquette pour le brouillon de l'exercice 4 sauvegardé à 8 h 46, en graphite) et que le temps continue de s'écouler : la durée compte depuis le début de la session (startedAt), d'où 0:37:40 restant et un code qui ne sert que jusqu'à 9 h 30. Répondre, la liste et « Rendre ma copie » sont inactifs, reliés au message par aria-describedby. Ni flèche ni croix : l'épreuve attend la reprise ou la fin du temps."
- screen: exercice
  note: "Le code de reprise : un champ libellé « Code de reprise », six caractères en Atkinson Hyperlegible Mono espacée (O et 0, I et 1 s'y distinguent), la consigne « Votre enseignant vous le donne en salle » reliée par aria-describedby, et Reprendre, action primaire, à côté sur bureau et sous le pouce sur téléphone. Code faux (état code-faux, 8 h 53 : Inès tape K7Q2MX au lieu de K7Q2XM) : le champ passe en erreur (.input.invalid, aria-invalid), une ligne .field-error dessous dit « Ce code ne permet pas de rouvrir votre copie. » avec error et le mot « Erreur » pour les lecteurs d'écran, le focus revient au champ et le code se ressaisit sans limite. La plateforme affiche aujourd'hui « Vous n'êtes pas autorisé à ouvrir cette session. » dans un message global qui disparaît, loin du champ (player-activity.component.ts, open(code) et onCodeComplete). Après 9 h 30, openSessionWithCode refuse une session expirée : l'écran devient temps-ecoule, la copie partant telle qu'elle était à l'arrêt (4 réponses validées, le brouillon du 4)."
- screen: exercice
  note: "Ce que fait le code, côté plateforme : player-manager.model.ts, openSessionWithCode (vers les lignes 109 à 130), compare le code saisi à celui de l'activité (K7Q2XM pour l'Examen partiel 2), refuse une session expirée, puis remet navigation.terminated à false ; la copie reprend là où elle s'était arrêtée, rien n'est perdu ni rejoué. L'enseignant voit ce code masqué, sous le nom « Code de reprise », dans les paramètres de l'activité et dans le suivi (Accès individuels), et le donne à l'étudiant concerné ; « Nouveau code » rend l'ancien inutilisable. Inès reprend à 8 h 54 : exercice 6 validé à 8 h 56, brouillon de l'exercice 7 à 8 h 58, exercice 8 validé à 9 h 03, copie rendue à 9 h 04."
- screen: exercice
  note: "Question ouverte, téléphone d'un candidat : la règle actuelle arrête le test dès que la page perd le focus, et sur un téléphone un appel ou une notification suffit. Proposition à trancher, pas encore décidée : au retour, un avertissement dit combien de temps la page a été quittée et que la commission le verra ; seule une absence longue (par exemple plus de 2 minutes) arrête le test. En attendant, les consignes du candidat disent la règle actuelle telle qu'elle est, et lui conseillent Ne pas déranger."
- screen: exercice
  note: "Proposition, changement de modèle à valider : une panne de PLaTon détectée par le serveur (service des exercices ou API qui ne répond plus) met le chronomètre en pause ; une coupure de la connexion de l'étudiant, jamais, faute de pouvoir la distinguer d'une sortie. Aujourd'hui, isTimeouted et getClosingTime (libs/feature/player/common/src/lib/player.model.ts) comptent depuis startedAt + settings.duration sans rien retrancher, et le chronomètre du client part de getClosingTime (player-activity.component.ts). Il faudrait enregistrer les périodes de panne côté serveur et les retrancher dans ces deux fonctions. Tant que ce n'est pas décidé, aucun écran ne dessine de pause : pause_circle reste au tableau des glyphes pour le jour où la proposition sera retenue, et les écrans disent « le temps continue de s'écouler »."
- screen: rendre
  note: "Rendre se confirme. La copie (glyph-copie) en tête, le compte (6 exercices sur 8 enregistrés), puis chaque exercice non validé : une ligne qui est un lien, pas un choix. Le glyphe du brouillon (save, graphite), le nom de l'exercice à la couleur des liens, l'heure du brouillon, puis « Y revenir » et sa flèche. Les brouillons partent tels quels, comme la page de garde l'annonce. Le temps restant aide à décider. Rendre ma copie est primaire et mène à la conclusion ; Continuer l'examen, le voile et Échap ferment la confirmation. Sur téléphone, c'est une feuille, Rendre au plus près du pouce. Derrière, Rendre ma copie n'apparaît qu'une fois."
- screen: rendre
  note: "Pour un candidat (état candidat, 15 h 42), Mariam vient de valider le 6e exercice, une question à réponses multiples (cases à cocher scellées, en lecture seule, sans juste ni faux) ; « Rendre mon test » est devenu l'action primaire, dans l'en-tête. La confirmation dit « Rendre votre test ? », que les 6 exercices sont enregistrés et qu'il reste 18 minutes : 1 h 12 comptées depuis 14 h 30, coupure de 15 h 12 à 15 h 16 comprise. Elle ne présente pas la coupure comme non comptée : le temps a couru, comme partout. Elle mène à envoye. Quand tout est validé, la liste laisse place à une seule ligne : rien ne reste à valider."
- screen: temps-ecoule
  note: "Le temps est écoulé (9 h 30, si Inès n'avait pas rendu sa copie) : la copie part telle quelle, comme la page de garde l'annonce, et la page dit ce qui a été gardé, au cadenas les réponses validées, à la disquette les brouillons, en graphite. L'épreuve est finie : la page a sa propre sortie, la flèche et Revenir au cours. Voir mon résultat est primaire et mène à la conclusion. Pour un candidat, la fin du temps mène directement à envoye ; pour une copie arrêtée qui n'a pas été reprise, la page dit ce qui était gardé à l'arrêt."
- screen: conclusion
  note: "D'abord l'achèvement : le titre « Examen terminé », l'icône task_alt et la barre pleine en chaleur, puis ce qui a été rendu : « Copie rendue à 9 h 04 : 6 exercices validés, 2 rendus en brouillon ». La chaleur ne touche jamais la note : 72 est dans la couleur du texte, et un 31 recevrait le même accueil. Aucun identifiant de session. Le résultat est celui d'Inès le 12 octobre à 9 h 04, copie rendue en 1 h 04."
- screen: conclusion
  note: "Décision : quelques minutes après le rendu, la note de l'épreuve est montrée et écrite « provisoire » ; chaque exercice montre son état en toutes lettres (réussi check_circle, réussi en partie contrast, à revoir error) et dit s'il est parti en brouillon, mais pas sa note. Un « 0 / 100 » sur le brouillon de l'exercice 4, que le correcteur peut encore relire, serait dur et peut-être faux. Les notes par exercice paraissent avec la copie corrigée. La note provisoire reste la moyenne des notes automatiques : (100 + 50 + 100 + 0 + 100 + 100 + 76 + 50) / 8 = 72. Pour un entraînement, chaque ligne montre sa note."
- screen: conclusion
  note: "Chaque ligne est un lien vers l'exercice dans la copie d'Inès : la copie rendue existe dès 9 h 04. Avant la relecture, elle montre ses réponses telles que rendues, scellées, avec l'état de chaque exercice, sans bonne réponse ni remarque (d'autres étudiants composent jusqu'à 9 h 30) ; après la relecture, c'est la copie corrigée."
- screen: conclusion
  note: "Et ensuite : deux liens vrais le 12 octobre. La copie corrigée de TP 3, dont l'appréciation parlait déjà des valeurs limites ; Challenge : tris, où Inès en est à 2 exercices sur 5, sans échéance. TP 5 a fermé le 11 octobre, le quiz et TP 4 de la semaine 4 aussi : ils ne sont pas proposés. La correction de l'examen n'est pas faite : pas de lien vers elle, une notification préviendra Inès."
- screen: quitter
  note: "Avertissement de sortie (quitter) : il s'ouvre quand l'étudiant prend le retour du navigateur, ou le geste retour du téléphone, pendant l'épreuve. Il dit la conséquence avec le verbe de partout : « Quitter l'épreuve l'arrête : vous pourrez la reprendre avec le code que donne l'enseignant, tant que le temps n'est pas écoulé. », que le temps continue de s'écouler et combien il en reste. Rester dans l'épreuve est primaire, au plus près du pouce sur téléphone ; Quitter et arrêter l'épreuve est un bouton danger discret qui nomme l'action et mène au cours ; au retour dans l'épreuve, la copie est arrêtée (état interrompu). Le voile et Échap valent Rester."
- screen: quitter
  note: "Ce que la plateforme permet de prévenir aujourd'hui (player-activity.component.ts) : fermer l'onglet ou recharger déclenche la boîte du navigateur (onBeforeUnload, quand shouldWarnOnLeave, c'est-à-dire en cours d'épreuve avec terminateOnLeavePage), dont le texte ne se choisit pas ; le pointeur qui sort de la page vers la barre du navigateur affiche un bandeau (onDocumentPointerLeave, showLeaveWarning), qui prendra les mêmes mots, sans bloquer ; changer d'onglet ou d'application arrête l'épreuve sans délai (onVisibilityChange), la page étant déjà cachée. Le retour du navigateur, à l'intérieur de l'application, n'est intercepté par rien : sans garde de sortie (CanDeactivate) sur la page du lecteur, la copie part sans avertissement et se trouve arrêtée au retour (ngOnInit, terminatedAfterLeavePage). Cet avertissement suppose d'ajouter cette garde ; c'est pourquoi l'écran est gardé plutôt que laissé à la seule boîte du navigateur."
- screen: copie-corrigee
  note: "La copie rendue. C'est l'aboutissement de la marge : le numéro, le résultat et la note de chaque exercice y sont inscrits, « 80 » puis « / 100 » dessous, comme partout « 82 / 100 » avec ses espaces ; un point sur le filet marque la hauteur de chaque remarque du correcteur : rouge sous une remarque, vert sous un compliment (exercice 3, .annotation praise). Chaque exercice n'ayant qu'une question, la marge porte le numéro de l'exercice."
- screen: copie-corrigee
  note: "L'appréciation, signée, ferme la copie en deux lignes, pas en un mur rouge : d'abord ce qui va bien, à l'encre verte (.annotation praise), puis la seule chose à travailler, à l'encre rouge, avec ses trois exemples (1900, 15, un discriminant nul). Les remarques détaillées sont déjà sous chaque exercice."
- screen: copie-corrigee
  note: "La note suit le calcul de la plateforme (CorrectionService, ResourceLabel) : chaque exercice est noté sur 100 par ses tests, une étiquette du correcteur change la note de l'exercice où elle est posée, et la note de la copie est la moyenne. Note automatique 81,6 ; « Solution élégante » +5 porte l'exercice 3 de 95 à 100, « Nommage peu clair » -2 l'exercice 7 de 36 à 34 ; moyenne des 7 exercices, 82. Sous la réponse d'un exercice étiqueté, une ligne montre ce calcul."
- screen: copie-corrigee
  note: "Sous chaque réponse, le résultat des tests automatiques, discret quand tout passe, avec le test qui échoue quand il en manque. Entrées : « Voir la correction » sur l'accueil étudiant et la notification, « Voir mes résultats » dans la vue étudiant du cours, et la conclusion de l'examen partiel 2. Dans la liste à droite, chaque note s'écrit « 100 / 100 ». Sur téléphone, la note passe en tête et la copie prend toute la largeur, marge à 42 px."
