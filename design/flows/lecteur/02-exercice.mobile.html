<header class="topbar">
  <button class="btn btn-icon" aria-label="Quitter l'activité" data-wf-to="quitter"><svg class="ico"><use href="#arrow_back" /></svg></button>
  <span class="topbar-title" style="flex: 1; font-size: 15px">Exercice 3 sur 8</span>
  <span class="num" style="font-family: var(--font-mono); font-size: 14px">1:12:40</span>
</header>
<main class="m-main" style="padding: var(--spacing-4)">
  <div class="copie" style="padding: var(--spacing-5) var(--spacing-4) var(--spacing-5) 56px">
    <div class="q">
      <div class="q-mark" style="left: -48px; width: 32px"><span>1</span></div>
      <h2 class="heading">Combien d'opérations élémentaires pour un tableau de taille n&nbsp;?</h2>
      <div class="statement" style="font-size: 15px; line-height: 24px">
        <span class="code" style="margin-top: 0">def somme(t):
    s = 0
    for x in t:
        s = s + x
    return s</span>
      </div>
      <div class="answer"><div class="input focused" style="height: 44px"><span class="placeholder">Votre réponse</span></div></div>
    </div>
    <div class="q">
      <div class="q-mark" style="left: -48px; width: 32px"><span>2</span></div>
      <h2 class="heading">Complexité de <code>somme</code> dans le pire cas&nbsp;?</h2>
      <div class="answer options">
        <div class="option" style="min-height: 44px"><span class="box"></span>O(1)</div>
        <div class="option on" style="min-height: 44px"><span class="box"></span>O(log n)</div>
        <div class="option" style="min-height: 44px"><span class="box"></span>O(n)</div>
        <div class="option" style="min-height: 44px"><span class="box"></span>O(n²)</div>
      </div>
    </div>
  </div>
  <div style="display: grid; gap: var(--spacing-2); margin-top: var(--spacing-4)">
    <a class="btn btn-primary btn-lg"><svg class="ico"><use href="#check" /></svg>Valider</a>
    <a class="btn btn-secondary" data-wf-to="exercice">Exercice suivant<svg class="ico"><use href="#chevron_right" /></svg></a>
  </div>
</main>
