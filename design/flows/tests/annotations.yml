- screen: test
  note: "Vendredi 9 octobre, en fin d'après-midi : Mariam a envoyé son test à 15 h 42, Lucas Bernard le passe depuis 15 h 20, Yanis Belkacem l'a terminé le 5 octobre à 16 h 12. L'état d'un candidat se déduit de sa session (pas commencé, en cours, terminé) ; l'état de l'invitation (envoyée ou non) demande un champ, voir la carte de faisabilité."
- screen: test
  note: "Un seul vocabulaire : les filtres portent exactement les mots des étiquettes (Terminé, En cours, Invitation envoyée, Invitation non envoyée), et leurs nombres font les 48 candidats. Sous l'étiquette, la date qui va avec l'état, en absolu, sans genre : « compte créé le 9 octobre », la plateforme ne connaît pas le genre de Clara Vidal. « En cours » est neutre avec pending ; « Terminé » est neutre avec le cadenas (le test est scellé, ce n'est pas une réussite : 64 / 100 n'est pas « juste ») ; le bleu repère reste à ce qui est planifié."
- screen: test
  note: "Une action principale dans l'en-tête : envoyer les invitations en attente (1, Clara Vidal). Ajouter un candidat et Importer un CSV sont dans le menu Ajouter des candidats, au-dessus de la liste ; Exporter les résultats est au pied du tableau. Aperçu candidat montre à l'enseignant la page que verront les candidats, consignes et conditions comprises."
- screen: test
  note: "Sélection (état selection) : chaque ligne se coche, la case de l'en-tête coche la liste filtrée. Filtrer « Invitation envoyée » puis tout cocher sélectionne les 23 candidats qui n'ont pas commencé ; la barre de sélection, sur la couverture, nomme l'action et le nombre (Relancer les 23 candidats). Une sélection mêlée ne relance que ceux qui n'ont pas commencé, et la barre le dit. La relance renvoie le lien, valable jusqu'au 15 octobre."
- screen: candidat
  note: "La couverture de la connexion, pour une personne qui ne connaît pas PLaTon. Sur la couverture est posée la page de garde de sa copie : une feuille claire, son nom dans le coin, la marge rouge, et les 4 consignes numérotées dans la marge, une par ligne réglée, comme sur une copie d'examen. C'est le langage de la copie, que Mariam retrouve dans le lecteur. La première consigne dit qu'il y a 6 exercices et qu'on passe de l'un à l'autre librement. Une feuille posée n'a pas d'ombre : seul ce qui flotte en a une."
- screen: candidat
  note: "Sur la page, il ne reste que ce qui se fait : vérifier, lire les conditions, accepter, commencer. Les consignes disent la règle commune du temps : il court dès que l'on commence, même si la connexion tombe, et à la fin du temps le test part tel quel. Elles ne promettent aucune pause : la proposition de pause sur panne de PLaTon (lecteur) ne vaut jamais pour une coupure de la connexion du candidat."
- screen: candidat
  note: "Vérifier mon navigateur : la connexion est vérifiée à l'arrivée (check, en graphite : une vérification réussie rassure, elle ne célèbre pas) ; le plein écran ne peut s'essayer qu'après un clic (règle des navigateurs), d'où le bouton Tester le plein écran. Mariam découvre ainsi le plein écran avant le chronomètre, pas pendant."
- screen: candidat
  note: "Plein écran refusé (état plein-ecran) : la ligne passe en attention, avec warning et le mot « refusé », dit quoi faire (autoriser le plein écran pour ce site dans les réglages du navigateur, ou Chrome, Firefox ou Edge sur un ordinateur) et propose Réessayer. La liste est une région polie, qui annonce le résultat. Commencer n'est pas bloqué : ici, Mariam a coché les conditions et peut commencer, la ligne sous le bouton rappelle que quitter la page arrête toujours le test."
- screen: candidat
  note: "Sur téléphone, la carte devient « Préparer mon téléphone » et ajoute un conseil, distinct des vérifications puisque le navigateur ne peut pas le vérifier : activer Ne pas déranger (notifications_off), parce qu'un appel ou une notification qui fait changer d'application arrête le test ; en mode avion, garder le Wi-Fi."
- screen: candidat
  note: "Questions ouvertes. Sur iPhone, Safari n'accorde pas le plein écran à une page : test permis sans plein écran sur ces téléphones, ou ordinateur exigé et annoncé dans l'invitation, à trancher avec l'équipe pédagogique. Le plein écran obligatoire est d'ailleurs un réglage des maquettes : le lecteur d'aujourd'hui arrête le test quand la page perd le focus ou devient cachée (terminateOnLoseFocus et terminateOnLeavePage, activés par défaut pour un test dans tests-settings.component.ts), pas quand on quitte le plein écran. Les consignes disent la règle actuelle telle qu'elle est (quitter la page ou changer d'application arrête le test, même pour un appel)."
- screen: candidat
  note: "La case est décochée à l'arrivée. Commencer le test reste inactif (aria-disabled) tant qu'elle ne l'est pas, et une ligne sous le bouton dit pourquoi. Cocher la case active le bouton, sans autre étape. Sur téléphone, la case et le bouton restent en bas de l'écran ; le mot conditions y renvoie au texte."
- screen: candidat
  note: "iPhone (état plein-ecran sur téléphone) : Safari n'accorde pas le plein écran à une page (document.fullscreenEnabled vaut false), la ligne le dit dès l'arrivée, sans bouton pour réessayer puisque rien n'y changerait : warning en attention avec le mot « impossible », ce que cela change (on peut commencer sans ; quitter la page ou changer d'application arrête toujours le test) et quoi faire (un ordinateur, avec le même lien, si possible). Commencer n'est pas bloqué. C'est la même décision que pour Inès en salle (lecteur, intro, état ios), dessinée en attendant celle de l'équipe : test permis sans plein écran sur téléphone, ordinateur conseillé."
- screen: candidat
  note: "Question ouverte, la reprise d'un candidat : la plateforme le permet (le test est une activité notée, avec son code ; openSessionWithCode, player-manager.model.ts, ne distingue pas un test, et le suivi du test montre Régénérer le code), mais aucun enseignant n'est dans la pièce pour donner le code. Par la scolarité, sur demande, ou jamais : à trancher. Les consignes restent honnêtes dans les deux cas : quitter arrête le test, et Mariam ne peut pas le reprendre par elle-même."
- screen: envoye
  note: "La fin du test d'un candidat, à la place de la conclusion du lecteur : on y arrive par la confirmation « Rendre votre test ? » ou à la fin du temps. Mariam n'a ni cours ni accueil, donc ni Revenir au cours ni Accueil. La page confirme l'envoi et quand (vendredi 9 octobre à 15 h 42), la durée comptée depuis 14 h 30 (1 h 12 sur 1 h 30, il lui restait 18 minutes), coupure de 15 h 12 à 15 h 16 comprise et non présentée à part : le temps a couru, comme le disaient les consignes. Elle dit qui relit, quand et comment arrive la décision (avant le 6 novembre), qu'elle peut fermer la page, et donne la référence MI27-0418, reprise dans l'accusé de réception."
- screen: envoye
  note: "Pas de note : le résultat d'un test d'entrée passe par la commission. La chaleur ne marque que l'achèvement, sur l'icône. Rouvrir le lien de l'invitation après l'envoi affiche cette page."
