- screen: mes-cours
  note: "Tout ce que la liste actuelle permet est là : recherche sur le nom, Actuels et Archivés, tri (nom, création, mise à jour), période. L'administrateur a en plus Tous les cours de la plateforme (showAll)."
- screen: mes-cours
  note: "Le classeur : intercalaire et couverture à la teinte du cours, sigle tiré du nom, lignes de cahier. Pour l'enseignant, les chiffres sont ceux de la carte actuelle et disent ce qu'ils comptent (6 enseignants, 302 étudiants, 9 activités) ; l'icône des enseignants est la personne, le chapeau reste au cours. Le trophée ouvre les challenges."
- screen: mes-cours
  note: "Proposition : un champ colorHue sur Course, comme sur Activity. En attendant, la teinte est dérivée de l'id du cours côté client. AP1 est lagon partout, Analyse 1 olive, Algèbre 1 framboise, Programmation web bleuet, Java L3 ambre, et Algorithmique et programmation 2, le cours qu'on vient de créer, menthe."
- screen: mes-cours
  note: "État etudiant : la carte ne montre pas les effectifs, qui ne disent rien à Inès. Elle dit son avancement (statistic.progression, propre à la personne connectée), compté en exercices pour la barre et le pourcentage (AP1 : 34 sur 59, 58 % ; Analyse 1 : 16 sur 40, 40 %), avec le nombre d'activités terminées en texte, jamais à sa place, qui enseigne (le responsable et le nombre d'autres enseignants) et la prochaine échéance, à la couleur de son état. Algèbre 1, terminé, prend la barre d'achèvement et task_alt en chaleur. La barre est à la teinte du cours ; elle n'apparaît pas pour l'enseignant, pour qui elle ne veut rien dire."
- screen: mes-cours
  note: "État etudiant sur téléphone : le titre de la page est dans la barre (un h1 à 17 px), la recherche et Actuels ou Archivés au-dessus, une carte par cours avec sa marque, son avancement, sa prochaine échéance et qui enseigne. La carte entière ouvre le cours."
- screen: mes-cours-actions
  note: "Archiver range le cours pour soi seulement (archivage de l'appartenance). Le libellé le dit, parce que « Archiver ce cours » laisse croire qu'on le ferme pour tous. Le menu s'ouvre sous le bouton de la carte."
- screen: nouveau
  note: "L'assistant actuel n'a qu'une étape : Nom et Description, tous deux obligatoires. Un dialogue suffit. Karim y prépare Algorithmique et programmation 2, qui s'ouvre ensuite dans l'état vide de la page du cours."
- screen: detail
  note: "Onglets réels : Vue d'ensemble, Challenges (si challengeCount), Membres, Groupes, Paramètres (si permissions.update). L'étudiant n'a que Vue d'ensemble et Challenges : Membres et Groupes ne lui montreraient que des effectifs. Il n'y a pas d'onglet Résultats : aucun endpoint ne calcule de résultats au niveau du cours."
- screen: detail
  note: "Identité : la marque de cours (AP1, lagon) ouvre chaque page du cours, onglets, suivi et surcouches comprises. Les sections sont les intercalaires du classeur : un onglet lagon posé sur un filet lagon, avec le menu de la section au bout du filet. Les icônes des activités, la progression et le podium prennent la même teinte ; le challenge n'a plus de teinte à lui."
- screen: detail
  note: "Les sections suivent l'ordre que l'enseignant leur donne ; Karim met la semaine en cours en tête. AP1 a 5 sections et 9 activités, avec leurs états du 28 septembre (docs/09-donnees.md). L'icône d'une activité dit sa forme : quiz pour le QCM, code pour les TP, history_edu (la copie et la plume) pour une épreuve notée, emoji_events pour le challenge. Son état a son propre glyphe, sur la ligne, dans le tableau et sur l'étiquette : Planifiée event en repère, Ouverte event_available en validation, Fermée event_busy en graphite, En correction pending."
- screen: detail
  note: "Une action principale par onglet : l'emplacement de l'en-tête appartient à l'onglet actif, entre Partager et le menu du cours, et l'en-tête ne porte rien d'autre. Vue d'ensemble : Ajouter une activité. Membres : Ajouter des membres. Groupes : Ajouter un groupe. Challenges : aucune, un challenge s'ajoute comme une activité (fonction Challenge). Paramètres : aucune, Enregistrer est au pied du formulaire. Partager reste en secondaire partout."
- screen: detail
  note: "La barre garde trois réglages : la recherche (libellé lu par les lecteurs d'écran), le filtre d'état (Toutes, Ouvertes, Planifiées, Fermées, unique en tête au lieu d'être répété dans chaque section ; il dit le mot de l'étiquette Planifiée, au pluriel) et le choix de vue, écrit Sections et Tableau : aucune icône du jeu ne dit « sections empilées » ni « tableau » sans ambiguïté, et grid_view est déjà l'icône de l'onglet Vue d'ensemble. L'export des notes passe dans le menu de l'en-tête : Exporter les notes (CSV), par groupe si le cours en a."
- screen: detail
  note: "Lignes d'activité : la ligne entière ouvre le suivi, son titre en est le lien pour le clavier. Un bouton texte seulement quand une action est attendue (Planifier, pour TP 5, ouvert sans dates) ; le reste est dans le menu, qui nomme l'activité. Le classement du challenge n'est plus sur la ligne de l'enseignant : il a son onglet, Challenges. Le filet de section ne porte plus que le menu de la section : « + Activité » répétait l'action principale de l'en-tête, et Ajouter une activité ici est dans ce menu."
- screen: detail
  note: "Sans dates veut dire ouverte, comme dans le code (calculateActivityOpenState) : TP 5 est visible des étudiants depuis qu'il est dans le cours, et 23 l'ont commencé. Pour un entraînement, ce n'est pas un problème : l'enseignant lit l'état Ouverte, comme pour toute activité ouverte, puis « Sans dates » en texte neutre, avec Planifier. Une épreuve notée sans dates serait, elle, signalée en attention (priority_high et « Ouverte, sans dates »), parce qu'elle s'ouvre à tous sans durée de passage. L'étudiant voit TP 5 sans échéance et peut le commencer. Ces écrans sont ceux du 28 septembre avant que Karim enregistre le 5 octobre (voir parametres)."
- screen: detail
  note: "À faire : chaque élément ouvre l'endroit où agir. « 14 copies à corriger » compte le cours entier et le dit : Examen partiel 1, TD 2 et TD 4, confiées à Julien Lefèvre (Karim, qui n'en corrige aucune, ne les a pas dans son accueil). Un élément qui dit un état prend la couleur de cet état et son icône : ocre pour Ferme ce soir, comme sur la ligne. TP 5 à planifier est neutre, comme l'information sur sa ligne, et les copies aussi. Aucune teinte de cours ici."
- screen: detail
  note: "État etudiant : pas d'édition, pas d'export, pas d'effectifs. L'en-tête dit qui enseigne et la prochaine échéance ; la colonne de droite, son avancement (58 %, 34 exercices sur 59, 4 activités terminées sur 9), son temps passé et À reprendre, le quiz qui ferme ce soir, avec la seule action principale de la page. Sur les lignes : Commencer, Reprendre, Voir mes résultats (sa copie corrigée), la note quand elle existe, « Copie en correction » pour l'Examen partiel 1."
- screen: detail
  note: "État etudiant sur téléphone : la barre du haut est à la couleur de la couverture, avec la marque de cours et le nom du cours en h1 à 17 px, pas plus petit que les h2. Avancement, puis À faire (4 activités ouvertes, triées par échéance, cartes entières de 44 px au moins), puis Bientôt. Les sections viennent ensuite, en intercalaires qui se replient : chacun dit ce qu'il contient (« 3 activités, 2 à faire ») et le choix reste pour la personne. Reprendre l'activité qui ferme le plus tôt reste en bas, sous le pouce."
- screen: detail
  note: "État error : le chargement des activités a échoué. La page le dit, rappelle que le cours n'est pas vide et que les réponses validées sont enregistrées, et propose Réessayer. Jamais « Ce cours ne contient aucune section » (le bug relevé par Inès). Même état pour l'enseignant, sans ses actions d'édition tant que rien n'est chargé, et sur téléphone, où les deux boutons prennent toute la largeur. Règle du projet : message au bout de 10 s, erreur au bout de 30 s."
- screen: detail
  note: "État tableau : les colonnes de la vue tableau actuelle, sauf Avancement pour l'enseignant, et les 9 activités avec leurs dates absolues. Lignes denses de 44 px, dates sur une ligne. Comme en sections, la ligne ouvre le suivi ; sans dates, la ligne le dit dans Ouverture et Fermeture, avec Planifier à côté ; l'état garde son glyphe ; le menu porte un libellé qui nomme l'activité."
- screen: detail
  note: "État vide : Algorithmique et programmation 2, créé à l'instant, dit les trois étapes (activité, étudiants, partage) et propose de reprendre un cours existant. Proposition côté client : créer « Section 1 » à la première activité, l'API d'ajout de section existe."
- screen: activite-actions
  note: "Le menu de la carte actuelle, en quatre actions et deux groupes : régler et essayer (Régler l'activité, puisque la ligne n'a plus d'engrenage : « Paramètres » reste le mot de l'onglet du cours, et l'icône est tune, pas l'engrenage de cet onglet ; Tester l'activité ouvre le lecteur comme un étudiant), la ressource et ses notes (Ouvrir la ressource, d'où on l'édite ; Exporter les notes (CSV)). Suivre l'activité n'y est plus : la ligne entière ouvre le suivi, qui réunit Suivi et Statistiques. Le bouton du menu reste enfoncé tant que le menu est ouvert."
- screen: section-actions
  note: "Les actions de section en quatre entrées et trois groupes : Ajouter une activité ici (l'ajout s'ouvre sans l'étape Section), puis Renommer (aujourd'hui sur place) et Réordonner, qui réunit Réordonner les activités, Monter et Descendre : la section et ses activités prennent une poignée, ↑ et ↓ déplacent, Entrée pose, Échap annule. Supprimer la section vient en dernier. Insérer une section après disparaît : Ajouter une section, en bas de la page, puis Réordonner, font la même chose. Le menu s'ouvre au-dessus du bouton quand la place manque dessous, et le bouton reste enfoncé."
- screen: supprimer-section
  note: "La suppression d'une section se confirme par un dialogue qui nomme la section et ses activités. Vérité produit : les activités partent avec la section (CourseSection vers Activity en cascade, section.service). Le dialogue le dit, ainsi que ce qui reste : les exercices dans les ressources."
- screen: supprimer-section
  note: "Question ouverte : proposer, avant de supprimer, de déplacer les activités dans une autre section (le choix le plus sûr pour 2 activités ouvertes). Aujourd'hui l'API ne le fait pas ; il faudrait déplacer puis supprimer."
- screen: partager
  note: "Le partage actuel : Lien PLaTon ou Lien LTI, Copier le lien. Le panneau s'ouvre sous le bouton Partager ; le champ du lien a un libellé pour les lecteurs d'écran."
- screen: challenges
  note: "Le classement de la plateforme (LeaderboardService) : n'y entrent que ceux qui ont réussi tous les exercices d'un challenge, dans l'ordre de réussite. Un challenge réussi rapporte 100 points par exercice et un bonus de rang (100 pour le premier, 99 pour le deuxième), d'où 600, 599, 598 pour Challenge : tris et ses 5 exercices. 41 étudiants l'ont réussi. Le podium montre les trois premiers ; le sélecteur passe au classement d'un challenge, qui ajoute la date de réussite."
- screen: challenges
  note: "Le podium est à la teinte du cours : le rang se lit au chiffre et à la hauteur, le trophée marque la première place seulement. Aucune médaille ne prend une teinte de cours (un troisième en corail se lisait « faux »). Le podium est une liste ordonnée 1, 2, 3 ; l'ordre visuel 2, 1, 3 ne change pas l'ordre de lecture."
- screen: challenges
  note: "État etudiant : Votre place vient en tête. Inès a réussi 2 exercices sur 5, elle n'est donc pas encore classée : la carte le dit, dit ce qui manque et porte Reprendre le challenge. Une fois classée, sa ligne est surlignée, avec (vous). Sur téléphone, la même page : Votre place, puis le classement, podium resserré."
- screen: membres
  note: "Table actuelle : membre, date d'ajout, rôle modifiable (Étudiant, Enseignant ; verrouillé pour le propriétaire), retrait. Tous, Enseignants, Étudiants reprend les routes teachers et students qui existent sans onglet."
- screen: membres
  note: "Retirer un membre se fait en place : la ligne disparaît, les compteurs suivent (308 membres et 302 étudiants après le retrait de Gaëlle Picard) et la notification, « Gaëlle Picard ne fait plus partie du cours », propose Annuler ; la phrase ne suppose pas de genre, que la plateforme ne connaît pas. Elle reste jusqu'à ce qu'on la ferme, puisqu'elle porte une action. Chaque bouton de retrait nomme la personne ou le groupe."
- screen: membres
  note: "La notification ne cache rien de ce dont parle l'écran : chaque membre tient sur une ligne, le courriel dans sa colonne, et la page finit au-dessus d'elle, pagination comprise ; elle flotte sur un espace vide."
- screen: membres
  note: "Changer un rôle se confirme dans un dialogue qui nomme la personne (règle du projet). Il n'est pas dessiné ici."
- screen: membres-ajouter
  note: "Le dialogue actuel : rôle, recherche de personnes ou de groupes de la plateforme, sélection multiple. Les personnes déjà dans le cours restent dans les résultats, grisées, avec « Déjà membre du cours » et leur groupe : on comprend pourquoi on ne peut pas les cocher. Seuls les comptes enseignants peuvent devenir enseignants."
- screen: groupes
  note: "Groupes du cours : créer (nommé Groupe N), renommer, ajouter des étudiants, supprimer. La phrase d'intro dit à quoi ils servent, ce que la page actuelle ne dit pas. Le bouton de retrait d'une ligne retire l'étudiant du groupe, pas du cours, et le dit."
- screen: groupes
  note: "Supprimer un groupe se fait en place : AP1 avait cinq groupes, Karim vient de supprimer « Soutien du jeudi » (12 étudiants, créé le 21 septembre). Il en reste quatre, TD 1 à TD 4, et l'onglet compte 4 ; la notification propose Annuler et dit que ses étudiants restent dans le cours. Les groupes sont repliés, et la notification flotte là où était le cinquième : elle ne cache aucun groupe."
- screen: groupes
  note: "En place, parce que Soutien du jeudi ne servait à rien d'autre : aucune période d'accès, aucune copie confiée. Un groupe qui sert à une période d'accès (ses étudiants passeraient à « Tous les autres membres ») ou qui porte des copies confiées se supprime par un dialogue qui le dit ; la règle du projet le demande déjà pour un groupe de la plateforme."
- screen: reglages
  note: "L'onglet Paramètres actuel : Informations, Accès démo (lien, QR code, suppression), Charger un cours (ici Reprendre un cours existant), Supprimer le cours."
- screen: reglages
  note: "Pas d'action principale en tête : Enregistrer vit au pied du formulaire Informations, le seul bloc qui s'enregistre ; les autres agissent tout de suite. Supprimer le cours est à part, dans la zone de danger, en bouton de danger discret, et ouvre un dialogue."
- screen: supprimer-cours
  note: "Le dialogue nomme le cours avec sa marque, dit ce qui part (5 sections, 9 activités, réponses et notes des 302 étudiants, les 14 copies de l'Examen partiel 1 confiées à Julien Lefèvre, comme dans À faire) et ce qui reste (les exercices dans les ressources, le groupe de la plateforme). Il faut saisir le nom du cours : le bouton Supprimer le cours ne s'active qu'à la saisie exacte, montrée ici. Échap ou Annuler referme sans rien faire."
- screen: parametres
  note: "Les trois onglets du panneau actuel (Restrictions devient Accès, Paramètres devient Déroulement, Gestion). Pas de Fonction ici : isChallenge ne se modifie pas après l'ajout, et une activité notée n'est qu'un ensemble de réglages de Déroulement."
- screen: parametres
  note: "Accès de TP 5, le 28 septembre à 10 h : Karim saisit le lundi 5 octobre à 8 h et le dimanche 11 octobre à 23 h 59, pas encore enregistrés. Le panneau rappelle, en information neutre, que les étudiants voient TP 5 et que 23 l'ont commencé, et ce que change une ouverture au 5 octobre. Sans période, deux dates pour tout le cours. Avec des périodes (état periodes, sur l'Examen partiel 2), chaque carte dit Quand, Durée, Qui (groupes, personnes, tous les autres) et Corrigé par."
- screen: parametres
  note: "Ordre des périodes, vérité produit (ActivityDatesService) : la première période dont la personne fait partie s'applique, « Tous les autres membres » vaut pour qui n'est dans aucune autre. Le panneau l'écrit au-dessus des cartes, avec le cas en jeu (Amélie Roux et Hugo Marchand sont aussi dans TD 1), et la première carte porte « S'applique en premier ». Les poignées sont des boutons, l'ordre se change aussi au clavier."
- screen: parametres
  note: "Proposition, changement de modèle : chaque période porte sa durée. La période 1 (Amélie Roux et Hugo Marchand, tiers-temps) dure 2 h, fin au plus tard à 10 h, calculée depuis ses dates ; les périodes 2 et 3 n'en ont pas de propre et l'écrivent : 1 h 30, comme l'activité. Aujourd'hui, RestrictionConfig (libs/feature/course/common/src/lib/activity-restriction.model.ts) ne connaît que DateRange, Members, Groups, Correctors et Others, et la durée est settings.duration, pour l'activité entière. Le lecteur arrête la copie au plus tôt de startedAt + duration et de la fin de la période (getClosingTime et isTimeouted, libs/feature/player/common/src/lib/player.model.ts) : avec une période de 8 h à 10 h, Amélie et Hugo, s'ils commencent à 8 h, sont arrêtés à 9 h 30. À faire : une durée dans la période, renvoyée avec ses dates par ActivityDatesService.getActivityDatesForUser, et prise avant settings.duration par le lecteur."
- screen: parametres
  note: "Déroulement garde la durée de l'activité ; une ligne sous le champ dit qu'une période d'accès règle la sienne dans Accès, pour qu'un tiers-temps ne se cherche pas au mauvais endroit."
- screen: parametres
  note: "Gestion : la couleur n'est plus choisie activité par activité, elle vient du cours (ligne en lecture seule). Les actions immédiates (Fermer, Mettre à jour, Supprimer) sont dans un bloc neutre à part, qui dit qu'elles s'appliquent dès le clic ; Enregistrer ne vaut que pour Accès et Déroulement. Seule l'action d'état qui s'applique apparaît : Fermer pour une activité ouverte, Rouvrir pour une activité fermée. Fermer porte block, l'icône des actions qui coupent un accès : do_not_disturb_on est l'état d'une épreuve arrêtée et lock celui d'une réponse scellée, et un état ne va jamais sur un bouton."
- screen: parametres
  note: "Le panneau s'ouvre par Régler l'activité (menu de la ligne, en-tête du suivi). Sécurité, dans Déroulement : les interrupteurs disent le verbe de la page d'entrée d'une épreuve, Arrêter l'activité si l'étudiant quitte la page (terminateOnLeavePage) ou la fenêtre (terminateOnLoseFocus). Dès que l'un d'eux est actif, l'activité a un code de reprise (colonne virtuelle security d'Activity), et la ligne sous les interrupteurs dit où le trouver."
- screen: parametres
  note: "Supprimer une activité d'entraînement se fait en place, avec Annuler dans la notification. Une activité notée se supprime par un dialogue qui la nomme et dit ce qui part (copies, notes), sur le modèle de supprimer-cours. Mettre à jour remplace Recharger et dit quelle version l'activité suit."
- screen: suivi
  note: "Réunit les deux pages actuelles : Statistiques (/activities/:course/:activity) et Suivi de l'activité (/activities/monitor/…). Les onglets disent ce qu'ils font : Statistiques, Étudiants, Accès individuels. Pas d'action principale en tête : Corriger n'y apparaît que si l'activité a des copies en attente, ce qui n'est pas le cas de ce quiz corrigé automatiquement. Le fil d'Ariane part de Cours, comme sur les autres pages du cours. En tête, Régler l'activité ouvre le panneau de réglage, comme le menu de la ligne."
- screen: suivi
  note: "Statistiques : les cinq indicateurs et le tableau par exercice de la page actuelle (ActivityExerciseResults), avec les six exercices du quiz (docs/09-donnees.md). Le quiz ferme ce soir : les cinq chiffres sont provisoires, dit une fois au-dessus d'eux plutôt que sur trois cartes sur cinq. Chaque indicateur a son icône, jamais celle d'un état : percent pour le taux de réussite, trending_down pour les abandons. La participation s'écrit « 251 sur 302 ont commencé »."
- screen: suivi
  note: "Le plus bas : la ligne où la réussite du premier coup est la plus basse est en attention, avec priority_high et les mots « le plus bas » : un chiffre bas est à surveiller, pas une erreur. Le titre du tableau y mène (Le plus bas : exercice 4) et la ligne mène aux étudiants concernés : Voir les 152 étudiants ouvre Étudiants filtré sur l'exercice 4 (198 des 251 l'ont fait, 46 justes du premier coup, soit 23 %)."
- screen: suivi
  note: "Étudiants : le tableau Résultats par apprenants (un état par exercice, la note). Les colonnes portent le numéro et un nom court de l'exercice (nom complet au survol et pour les lecteurs d'écran). Chaque état a sa forme, celle du tableau des glyphes : check_circle juste, contrast partiel, error à revoir, pending en cours, cercle vide pas commencé. Tri par nom ou par note, filtre par groupe de TD et par état, 50 étudiants par page."
- screen: suivi
  note: "Accès individuels : ouvrir ou fermer pour des étudiants choisis, dans une liste qui se cherche, se filtre par groupe et se pagine (302 étudiants). La barre de sélection dit combien sont choisis et porte l'action principale, Ouvrir pour 2 étudiants. Fermer pour porte block, l'icône des actions qui coupent un accès, et Ouvrir pour la clé de l'accès, pas le cadenas d'une réponse scellée ni la lecture de Tester."
- screen: suivi
  note: "Ce quiz n'a aucune règle qui l'arrête quand on le quitte : il n'a pas de code de reprise, et une ligne discrète le dit sous la description, là où l'enseignant le chercherait. La plateforme ne montre le code que si l'activité en a un (activity-moderation, code()), c'est-à-dire si terminateOnLeavePage ou terminateOnLoseFocus est actif (colonne virtuelle security d'Activity). Pour une épreuve notée qui s'arrête, comme Examen partiel 2 (K7Q2XM), la carte du code revient à droite : masqué, Afficher, Copier, Nouveau code, et la phrase qui dit qu'il rouvre une épreuve arrêtée tant que son temps n'est pas écoulé."
